<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Beryl 的交互设计作品集" />
    <title>Beryl | Demo Portfolio</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap");

      :root {
        --ink: #15211c;
        --paper: #f5f1e9;
        --cream: #fffdf8;
        --lime: #cfed75;
        --coral: #ff8a65;
        --line: rgba(21, 33, 28, 0.18);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 8%, rgba(207, 237, 117, 0.5), transparent 26rem),
          radial-gradient(circle at 90% 90%, rgba(255, 138, 101, 0.22), transparent 28rem),
          var(--paper);
        font-family: "DM Sans", sans-serif;
      }

      .page { max-width: 1180px; margin: 0 auto; padding: 34px 28px 56px; }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding-bottom: 22px;
      }

      .brand, .eyebrow, .number, .visit { font-family: "DM Mono", monospace; letter-spacing: 0.04em; }
      .brand { font-size: 0.9rem; font-weight: 500; }
      .status { display: flex; align-items: center; gap: 8px; font: 0.72rem "DM Mono", monospace; }
      .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #4c9a52; box-shadow: 0 0 0 4px rgba(76, 154, 82, 0.14); }

      .intro { padding: clamp(56px, 11vw, 128px) 0 clamp(42px, 7vw, 76px); }
      .eyebrow { margin: 0 0 20px; font-size: 0.72rem; text-transform: uppercase; }
      h1 { max-width: 860px; margin: 0; font-family: "Playfair Display", serif; font-size: clamp(3.25rem, 8.5vw, 7.25rem); line-height: 0.93; letter-spacing: -0.06em; font-weight: 600; }
      h1 em { color: #ec6244; font-weight: 600; }
      .intro p { max-width: 455px; margin: 32px 0 0; font-size: 1.05rem; line-height: 1.65; }

      .section-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
      .section-title h2 { margin: 0; font-size: 1rem; }
      .section-title span { font: 0.72rem "DM Mono", monospace; }

      .projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); }
      .project {
        display: flex;
        min-height: 270px;
        flex-direction: column;
        justify-content: space-between;
        padding: 25px;
        color: inherit;
        text-decoration: none;
        background: rgba(255, 253, 248, 0.58);
        transition: background 180ms ease, transform 180ms ease;
      }
      .project:nth-child(odd) { border-right: 1px solid var(--line); }
      .project:nth-child(-n + 2) { border-bottom: 1px solid var(--line); }
      .project:hover, .project:focus-visible { background: var(--cream); transform: translate(-4px, -4px); outline: 2px solid var(--ink); outline-offset: -2px; }

      .topline { display: flex; justify-content: space-between; align-items: flex-start; }
      .number { font-size: 0.73rem; }
      .dot { width: 13px; height: 13px; border-radius: 50%; background: var(--lime); }
      .project:nth-child(2) .dot { background: var(--coral); }
      .project:nth-child(3) .dot { background: #8fd8cf; }
      .project:nth-child(4) .dot { background: #dfb5ff; }
      .project h3 { max-width: 360px; margin: 30px 0 10px; font-size: clamp(1.65rem, 3vw, 2.45rem); line-height: 1; letter-spacing: -0.05em; }
      .project p { max-width: 350px; margin: 0; color: rgba(21, 33, 28, 0.72); font-size: 0.93rem; line-height: 1.45; }
      .visit { align-self: flex-end; margin-top: 18px; font-size: 0.72rem; text-transform: uppercase; }
      .visit::after { content: " ↗"; font-size: 1rem; }

      footer { display: flex; justify-content: space-between; gap: 20px; padding-top: 24px; font: 0.7rem "DM Mono", monospace; color: rgba(21, 33, 28, 0.68); }

      @media (max-width: 620px) {
        .page { padding: 22px 18px 34px; }
        .projects { grid-template-columns: 1fr; }
        .project { min-height: 230px; }
        .project:nth-child(odd) { border-right: 0; }
        .project:nth-child(-n + 2) { border-bottom: 1px solid var(--line); }
        .project:nth-child(3) { border-bottom: 1px solid var(--line); }
        footer { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <div class="brand">BERYL / PORTFOLIO</div>
        <div class="status">4 SELECTED DEMOS</div>
      </header>

      <section class="intro">
        <p class="hero-message">点击下面项目查看不同交互与产品体验 demo。</p>
      </section>

      <section aria-labelledby="projects-heading">
        <div class="section-title">
          <h2 id="projects-heading">精选作品</h2>
          <span>按展示顺序排列</span>
        </div>
        <div class="projects">
          <a class="project" href="https://beryl813.github.io/city-tab-rebuild-demo/" target="_blank" rel="noopener noreferrer">
            <div class="topline"><span class="number">01 / 04</span><span class="dot"></span></div>
            <div><h3>City Tab Rebuild</h3><p>城市内容页的重构与探索。</p></div>
            <span class="visit">查看 Demo</span>
          </a>
          <a class="project" href="https://zhangbaoyue813.github.io/adapty-paywall-rebuild-demo/" target="_blank" rel="noopener noreferrer">
            <div class="topline"><span class="number">02 / 04</span><span class="dot"></span></div>
            <div><h3>Movable Paywall</h3><p>可视化购买页搭建工具。</p></div>
            <span class="visit">查看 Demo</span>
          </a>
          <a class="project" href="https://beryl813.github.io/AI--feedback--demo/" target="_blank" rel="noopener noreferrer">
            <div class="topline"><span class="number">03 / 04</span><span class="dot"></span></div>
            <div><h3>AI Feedback</h3><p>面向用户反馈的 AI 体验设计。</p></div>
            <span class="visit">查看 Demo</span>
          </a>
          <a class="project" href="https://beryl813.github.io/VIP--rights--paywall--demo/" target="_blank" rel="noopener noreferrer">
            <div class="topline"><span class="number">04 / 04</span><span class="dot"></span></div>
            <div><h3>VIP Rights Paywall</h3><p>会员权益与付费转化体验。</p></div>
            <span class="visit">查看 Demo</span>
          </a>
        </div>
      </section>

      <footer><span>DESIGNED TO BE EXPLORED</span><span>2026</span></footer>
    </main>
  </body>
</html>
